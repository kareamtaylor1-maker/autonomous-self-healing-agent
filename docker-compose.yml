services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentdb
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentdb"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No host port published for PostgreSQL.

  coordinator:
    build: ./coordinator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://agent:${POSTGRES_PASSWORD:-change-this-local-password}@postgres:5432/agentdb
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
