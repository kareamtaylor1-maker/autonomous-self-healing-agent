name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coordinator/requirements.txt
      - name: Install dependencies
        working-directory: coordinator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q coordinator
      - name: Run API tests
        working-directory: coordinator
        env:
          OPENAI_API_KEY: ""
        run: pytest -q
